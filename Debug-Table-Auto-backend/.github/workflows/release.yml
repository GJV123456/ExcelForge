name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - id: version
        shell: bash
        run: |
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "Release v${version} already exists; increment VERSION before merging" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: backend/.venv/Scripts/python.exe
            asset: build/release/Debug-Table-Auto-*-windows-x64.zip
            artifact: release-windows-x64
          - os: ubuntu-latest
            python: backend/.venv/bin/python
            asset: build/release/Debug-Table-Auto-*-linux-x64.deb
            artifact: release-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m venv backend/.venv
      - run: "${{ matrix.python }}" -m pip install -r backend/requirements-dev.txt
      - run: "${{ matrix.python }}" scripts/build_release.py
      - run: "${{ matrix.python }}" scripts/verify_release.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  collect:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Generate reproducible SBOM
        shell: bash
        run: |
          version='${{ needs.validate.outputs.version }}'
          cyclonedx-py requirements backend/requirements.txt \
            --output-reproducible \
            --output-format JSON \
            --output-file "assets/Debug-Table-Auto-${version}-sbom.cdx.json"
      - name: Add standalone approved import template
        run: cp 'data/raw/联调测试表导入模版.xls' 'assets/联调测试表导入模版.xls'
      - run: python scripts/generate_checksums.py assets
      - name: Reject forbidden package content
        shell: bash
        run: |
          expected=F265767DD82C5CA1CDFE24BF904E06403C5221E513EED94F6CAF8E37157F5B5D
          mkdir -p extracted
          for archive in assets/*.zip; do
            if unzip -l "$archive" | grep -E '(^|/)(\.venv|node_modules|site-packages|tests|fixtures)(/|$)'; then
              exit 1
            fi
            rm -rf extracted/*
            unzip -q "$archive" -d extracted
            actual=$(sha256sum extracted/DebugTableAuto/联调测试表导入模版.xls | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
            test "$actual" = "$expected"
          done
          for archive in assets/*.deb; do
            if dpkg-deb --contents "$archive" | grep -E '(^|/)(\.venv|node_modules|site-packages|tests|fixtures)(/|$)'; then
              exit 1
            fi
            rm -rf extracted/*
            dpkg-deb --extract "$archive" extracted
            actual=$(sha256sum extracted/opt/debug-table-auto/联调测试表导入模版.xls | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
            test "$actual" = "$expected"
          done
          standalone=$(sha256sum assets/联调测试表导入模版.xls | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          test "$standalone" = "$expected"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collected-release-assets
          path: assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [validate, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: collected-release-assets
          path: assets
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v${{ needs.validate.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag" >&2
            exit 1
          fi
          gh release create "$tag" assets/* \
            --target '${{ github.event.pull_request.merge_commit_sha }}' \
            --title "$tag" \
            --generate-notes
